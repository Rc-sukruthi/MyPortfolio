<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | My Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-purple navbar-dark">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">My Portfolio</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#portfolioMenu" aria-controls="portfolioMenu" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="portfolioMenu">
                    <div class="navbar-nav ms-auto">
                        <a class="nav-link" href="index.html">Home</a>
                        <a class="nav-link" href="about.html">About</a>
                        <a class="nav-link" href="skills.html">Skills</a>
                        <a class="nav-link active" aria-current="page" href="contact.html">Contact</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5">
        <section class="card shadow-sm mx-auto p-4">
            <h1 class="text-purple">Contact Me</h1>
            <p>Thanks for visiting my portfolio. You can add your email address or other contact details here.</p>
            <h2 class="h4">Send a Message</h2>
            <p class="text-secondary small">This sample form is for practice and does not send messages.</p>
            <form id="contactForm">
                <label class="form-label" for="name">Your name</label>
                <input class="form-control mb-3" type="text" id="name" name="name" required>

                <label class="form-label" for="email">Your email</label>
                <input class="form-control mb-3" type="email" id="email" name="email" required>

                <label class="form-label" for="message">Your message</label>
                <textarea class="form-control mb-3" id="message" name="message" rows="4" required></textarea>
                <button class="btn btn-purple" type="submit">Show Message</button>
                <p id="formFeedback" class="alert alert-success mt-3 mb-0 d-none" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer class="text-center text-secondary py-3">
        <p class="mb-0">My Portfolio &copy; <span class="current-year"></span></p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
